<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cotizador Embark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#EDEFF2; --panel:#FFFFFF; --ink:#1F2328; --muted:#6A7078; --line:#D9DDE2;
  --field:#F7F8FA; --orange:#F47A20; --orange-ink:#FFFFFF; --orange-soft:#FDEBDC;
  --danger:#C4432B; --shadow:0 1px 2px rgba(20,24,30,.06),0 8px 24px rgba(20,24,30,.07);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15181C; --panel:#1E2227; --ink:#ECEEF1; --muted:#9AA1AA; --line:#323840;
    --field:#262B31; --orange-soft:#3A2618; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15181C; --panel:#1E2227; --ink:#ECEEF1; --muted:#9AA1AA; --line:#323840;
  --field:#262B31; --orange-soft:#3A2618; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Manrope,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:14px;padding:18px clamp(16px,4vw,40px) 6px}
.top img{height:30px;width:auto}
.top span{color:var(--muted);font-weight:600;font-size:14px;border-left:1px solid var(--line);padding-left:14px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:28px;padding:16px clamp(16px,4vw,40px) 120px;max-width:1320px;margin:0 auto;align-items:start}
@media (max-width:920px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:22px}
h2{font-size:15px;font-weight:700;margin:0 0 14px}
.grid2{display:grid;grid-template-columns:1fr 170px;gap:12px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.in{width:100%;background:var(--field);border:1px solid var(--line);border-radius:9px;padding:10px 12px;outline:none;min-height:42px;transition:border-color .15s}
.in:focus{border-color:var(--orange);box-shadow:0 0 0 3px color-mix(in srgb,var(--orange) 22%,transparent)}
textarea.in{resize:vertical;min-height:64px}
.sec{margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
.item{border:1px solid var(--line);border-radius:11px;padding:14px;margin-bottom:10px;background:var(--panel)}
.item-row{display:grid;grid-template-columns:1fr 36px;gap:8px;align-items:end}
.item-nums{display:grid;grid-template-columns:1fr 1.2fr .8fr 1.1fr;gap:10px;margin-top:10px}
.disc{font-size:12px;color:var(--muted);margin-top:4px;min-height:16px;text-align:right}
.custom{display:grid;grid-template-columns:1fr 110px;gap:10px;margin-top:10px}
@media (max-width:480px){.item-nums{grid-template-columns:1fr 1fr}.item-nums .sum{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:8px}.item-nums .sum label{margin:0}.item-nums .sum b{min-height:0;line-height:1.4}}
.sum{display:block}
.sum b{display:block;min-height:42px;line-height:42px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.x{width:36px;height:42px;border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;font-size:18px;line-height:1}
.x:hover{color:var(--danger);border-color:var(--danger)}
.add{width:100%;border:1.5px dashed var(--line);background:transparent;border-radius:11px;padding:12px;font-weight:700;color:var(--orange);cursor:pointer}
.add:hover{border-color:var(--orange);background:var(--orange-soft)}
.unit{font-size:12px;color:var(--muted);margin-top:4px;min-height:16px}
.preview{position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
@media (max-width:920px){.preview{position:static}}
.paper{background:#fff;border-radius:6px;box-shadow:var(--shadow);overflow:hidden;line-height:0}
.paper svg{width:100%;height:auto;display:block}
.pv-head{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 10px}
.pv-head h2{margin:0}
.pv-head small{color:var(--muted);font-size:13px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px clamp(16px,4vw,40px) calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:16px;z-index:5}
.bar .tot{margin-right:auto}
.bar .tot small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.bar .tot strong{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:10px;padding:13px 20px;font-weight:700;cursor:pointer;min-height:46px}
.btn-main{background:var(--orange);color:var(--orange-ink)}
.btn-main:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.hint{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:6;max-width:90vw;text-align:center}
.toast.on{opacity:1}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
@media (max-width:560px){.bar .btn-ghost{display:none}}
.modal{position:fixed;inset:0;background:rgba(10,12,15,.55);z-index:10;display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.modal[hidden]{display:none}
.modal-box{background:var(--panel);border-radius:14px;padding:16px;max-width:560px;width:100%;max-height:100%;overflow:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.modal-box img{width:100%;height:auto;display:block;border-radius:6px;margin-top:10px;box-shadow:var(--shadow);-webkit-touch-callout:default}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const CUSTOM = "__custom";

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
function fmtCOP(n){ return "$" + String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,"."); }
function parsePrice(s){ const d = String(s).replace(/[^\d]/g,""); return d ? parseInt(d,10) : 0; }
function parseQty(s){ s = String(s).trim().replace(/\s/g,""); if(!s) return 0;
  if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,""); s = s.replace(",", "."); const n = parseFloat(s); return isFinite(n) ? n : 0; }
function fmtQty(n){ return (Math.round(n*100)/100).toString().replace(".", ","); }
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function todayISO(){
  const p = new Intl.DateTimeFormat("en-CA",{timeZone:"America/Bogota",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
  const g = t => p.find(x=>x.type===t).value; return `${g("year")}-${g("month")}-${g("day")}`;
}
function fechaLarga(iso){ if(!iso) iso = todayISO(); const [y,m,d] = iso.split("-").map(Number); return `${d} de ${MESES[m-1]} de ${y}`; }
function esEmpresa(n){ return /\b(S\.?A\.?S?|LTDA|E\.?U|S\.?C\.?A|INC|CORP|GROUP|GRUPO)\b\.?/i.test(n); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function slug(s){ return (s||"Cliente").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,"") || "Cliente"; }

/* ---------- state ---------- */
let rows = [];
let uid = 0;
function newRow(){ return {id:++uid, ref:"", desc:"", unit:"", qty:"", price:"", dcto:""}; }
function parsePct(s){ const n = parseQty(s); return Math.min(Math.max(n,0),100); }

function rowResolved(r){
  if(!r.ref) return null;
  const qty = parseQty(r.qty), price = parsePrice(r.price);
  let desc, unit;
  if(r.ref === CUSTOM){ desc = r.desc.trim(); unit = r.unit.trim(); }
  else { const c = CATALOGO.find(c=>c.ref===r.ref); desc = c.desc; unit = c.unit; }
  if(!desc || !qty) return null;
  const bruto = qty*price, pct = parsePct(r.dcto), desc$ = Math.round(bruto*pct/100);
  return {desc, unit, qty, price, bruto, pct, dcto: desc$, total: bruto - desc$};
}

/* ---------- form rendering ---------- */
function optionsHTML(sel){
  let h = `<option value="" ${sel===""?"selected":""} disabled>Elegir producto…</option>`;
  for(const c of CATALOGO){
    const lbl = c.label || `${c.ref} · ${c.desc}`;
    h += `<option value="${c.ref}" ${sel===c.ref?"selected":""}>${esc(lbl)}</option>`;
  }
  h += `<option value="${CUSTOM}" ${sel===CUSTOM?"selected":""}>Producto personalizado…</option>`;
  return h;
}
function renderItems(){
  const box = $("#items"); box.innerHTML = "";
  rows.forEach((r,i)=>{
    const el = document.createElement("div"); el.className = "item"; el.dataset.id = r.id;
    const cat = CATALOGO.find(c=>c.ref===r.ref);
    const unitTxt = r.ref===CUSTOM ? "" : (cat && cat.unit ? `Unidad: ${cat.unit}` : "");
    el.innerHTML = `
      <div class="item-row">
        <div><label for="ref${r.id}">Producto ${i+1}</label>
          <select id="ref${r.id}" class="in" data-k="ref">${optionsHTML(r.ref)}</select></div>
        <button class="x" type="button" data-del aria-label="Quitar producto ${i+1}">×</button>
      </div>
      ${r.ref===CUSTOM ? `<div class="custom">
        <div><label for="d${r.id}">Descripción</label><input id="d${r.id}" class="in" data-k="desc" value="${esc(r.desc)}" placeholder="Ej. Grama Sintética 40mm"></div>
        <div><label for="u${r.id}">Unidad</label><input id="u${r.id}" class="in" data-k="unit" value="${esc(r.unit)}" placeholder="M2, und…"></div>
      </div>` : ""}
      <div class="item-nums">
        <div><label for="q${r.id}">Cantidad</label><input id="q${r.id}" class="in" data-k="qty" inputmode="decimal" value="${esc(r.qty)}" placeholder="0"><div class="unit">${unitTxt}</div></div>
        <div><label for="p${r.id}">Precio und</label><input id="p${r.id}" class="in" data-k="price" inputmode="numeric" value="${esc(r.price)}" placeholder="$0"></div>
        <div><label for="x${r.id}">Dcto %</label><input id="x${r.id}" class="in" data-k="dcto" inputmode="decimal" value="${esc(r.dcto)}" placeholder="0"></div>
        <div class="sum"><label>Total</label><b data-sum>${lineTotalTxt(r)}</b><div class="disc" data-disc>${discTxt(r)}</div></div>
      </div>`;
    box.appendChild(el);
  });
}
function lineTotalTxt(r){ const q = parseQty(r.qty), p = parsePrice(r.price); if(!(q && p)) return "—"; const b = q*p; return fmtCOP(b - Math.round(b*parsePct(r.dcto)/100)); }
function discTxt(r){ const q = parseQty(r.qty), p = parsePrice(r.price), pc = parsePct(r.dcto); return q && p && pc ? `−${fmtCOP(Math.round(q*p*pc/100))} (${fmtQty(pc)}%)` : ""; }

$("#items").addEventListener("input", e=>{
  const k = e.target.dataset.k; if(!k) return;
  const id = +e.target.closest(".item").dataset.id; const r = rows.find(x=>x.id===id);
  if(k==="price"){
    const n = parsePrice(e.target.value); const v = n ? fmtCOP(n) : "";
    const atEnd = e.target.selectionStart === e.target.value.length;
    e.target.value = v; r.price = v; if(atEnd) e.target.setSelectionRange(v.length,v.length);
  } else r[k] = e.target.value;
  if(k==="ref"){
    if(r.ref==="ENVIO" && !r.qty) r.qty = "1";
    renderItems(); const f = document.getElementById((r.ref===CUSTOM?"d":"q")+r.id); f && f.focus();
  } else {
    e.target.closest(".item").querySelector("[data-sum]").textContent = lineTotalTxt(r);
    e.target.closest(".item").querySelector("[data-disc]").textContent = discTxt(r);
  }
  update();
});
$("#items").addEventListener("click", e=>{
  if(!e.target.hasAttribute("data-del")) return;
  const id = +e.target.closest(".item").dataset.id;
  rows = rows.filter(x=>x.id!==id); if(!rows.length) rows.push(newRow());
  renderItems(); update();
});
$("#add").addEventListener("click", ()=>{ const r = newRow(); rows.push(r); renderItems(); document.getElementById("ref"+r.id).focus(); update(); });
["#cliente","#fecha","#nota"].forEach(s=>$(s).addEventListener("input", update));

/* ---------- layout (single source for preview + PDF) ---------- */
const W = 612, H = 792, M = 62, CW = W - 2*M;
const C = { or:"#F47A20", dark:"#222222", grey:"#666666", light:"#F9DFC5", line:"#DDDDDD", blue:"#2F6FD6", white:"#FFFFFF" };
const J = window.jspdf ? new window.jspdf.jsPDF({unit:"pt", format:"letter"}) : null;
function tw(s, size, bold){ J.setFont("helvetica", bold?"bold":"normal"); J.setFontSize(size); return J.getTextWidth(s); }
function wrap(s, size, bold, width){ J.setFont("helvetica", bold?"bold":"normal"); J.setFontSize(size); return J.splitTextToSize(s, width); }

function layout(d){
  const ops = [];
  const T = (s,x,y,size,o={}) => ops.push({t:"text", s, x, y, size, bold:!!o.bold, color:o.color||C.dark, align:o.align||"left"});
  // header
  T("PROCESOS Y SERVICIOS S.A.", M, 68, 11, {bold:true});
  T("NIT 805025495-0  ·  Carrera 11B # 32 – 72 BG 10D  ·  Cali, Colombia", M, 80, 7.5, {color:C.grey});
  const lw = 112, lh = lw*IMG_SIZE.logo[1]/IMG_SIZE.logo[0];
  ops.push({t:"img", k:"logo", x:W-M-lw, y:86-lh, w:lw, h:lh});
  ops.push({t:"line", x1:M, y1:96, x2:W-M, y2:96, color:C.or, lw:1.3});

  // measure
  const intro = "Reciban un cordial saludo. Somos Embark Global Imports, marca comercial de Procesos y Servicios S.A., distribuidores e importadores directos de productos plásticos y sintéticos de alta calidad. A continuación, nuestra propuesta comercial:";
  const introLines = wrap(intro, 8.5, false, CW);
  const cols = [CW*.46, CW*.16, CW*.19, CW*.19], P = 9;
  const body = d.items.map(it => ({...it, lines: wrap(it.desc, 8.5, false, cols[0]-2*P)}));
  const headH = 21, rowH = l => Math.max(22, l*11 + 11), totH = 22, dH = 18;
  const dLabel = it => `Descuento ${fmtQty(it.pct)}% · ${it.desc}`;
  body.forEach(it => { it.dLines = it.dcto ? wrap(dLabel(it), 8, false, cols[0]+cols[1]-2*P) : []; });
  const dRowH = it => it.dcto ? Math.max(dH, it.dLines.length*10 + 8) : 0;
  const tblH = headH + body.reduce((a,b)=>a+rowH(b.lines.length)+dRowH(b),0) + totH;
  let noteLines = [];
  if(d.nota){ noteLines = wrap("Nota: " + d.nota, 8.5, false, CW); }
  const closing = "Quedamos atentos a cualquier solicitud o inquietud. Contamos con inventario continuo y disponibilidad inmediata.";
  const closeLines = wrap(closing, 8, false, CW);
  const gh = 12, ih = introLines.length*12.5, nh = noteLines.length*12, clh = closeLines.length*11;
  const block = 20 + 16 + gh + 6 + ih + 14 + tblH + (nh ? 12 + nh : 0) + 14 + clh;
  const avail = (H-96) - 130;
  let y = 96 + Math.max(36, (avail - block)*0.20);

  T("COTIZACIÓN", M, y+17, 17, {bold:true, color:C.or});
  T(d.fecha, W-M, y+16, 8.5, {color:C.grey, align:"right"});
  y += 36;
  const saludo = (esEmpresa(d.cliente) ? "Estimados" : "Estimado(a)") + " ";
  T(saludo, M, y+9, 9);
  const sw = tw(saludo, 9, false);
  T(d.cliente, M+sw, y+9, 9, {bold:true});
  T(",", M+sw+tw(d.cliente, 9, true), y+9, 9);
  y += gh + 6;

  // justified intro
  introLines.forEach((ln, i) => {
    const by = y + 8.5 + i*12.5;
    const words = ln.trim().split(/\s+/);
    if(i === introLines.length-1 || words.length < 2){ T(ln.trim(), M, by, 8.5); return; }
    const ww = words.map(w=>tw(w, 8.5, false)); const gap = (CW - ww.reduce((a,b)=>a+b,0))/(words.length-1);
    let x = M; words.forEach((w,j)=>{ T(w, x, by, 8.5); x += ww[j] + gap; });
  });
  y += ih + 14;

  // table
  const top = y, xs = [M, M+cols[0], M+cols[0]+cols[1], M+cols[0]+cols[1]+cols[2], W-M];
  const cellText = (s, ci, by, o={}) => {
    if(ci===0) T(s, xs[0]+P, by, o.size||8.5, o);
    else if(ci===1) T(s, (xs[1]+xs[2])/2, by, o.size||8.5, {...o, align:"center"});
    else T(s, xs[ci+1]-P, by, o.size||8.5, {...o, align:"right"});
  };
  ops.push({t:"rect", x:M, y, w:CW, h:headH, fill:C.or});
  ["DESCRIPCIÓN","CANTIDAD","PRECIO UND","TOTAL"].forEach((h,i)=>cellText(h, i, y+headH/2+2.8, {size:8, bold:true, color:C.white}));
  y += headH;
  body.forEach((it, idx) => {
    const h = rowH(it.lines.length), mid = y + h/2;
    const startB = mid - ((it.lines.length-1)*11)/2 + 3;
    it.lines.forEach((ln, k) => T(ln, xs[0]+P, startB + k*11, 8.5));
    cellText(fmtQty(it.qty) + (it.unit ? " " + it.unit : ""), 1, mid+3);
    cellText(fmtCOP(it.price), 2, mid+3);
    cellText(fmtCOP(it.bruto), 3, mid+3);
    y += h;
    if(it.dcto){
      const dh = dRowH(it), dm = y + dh/2;
      const sB = dm - ((it.dLines.length-1)*10)/2 + 2.8;
      it.dLines.forEach((ln,k) => T(ln, xs[0]+P, sB + k*10, 8.5));
      cellText(`-${fmtQty(it.pct)}%`, 2, dm+2.8);
      cellText(`-${fmtCOP(it.dcto)}`, 3, dm+2.8);
      y += dh;
    }
    if(idx < body.length-1) ops.push({t:"line", x1:M, y1:y, x2:W-M, y2:y, color:C.line, lw:.5});
  });
  ops.push({t:"line", x1:M, y1:y, x2:W-M, y2:y, color:C.line, lw:.5});
  ops.push({t:"rect", x:M, y, w:CW, h:totH, fill:C.light});
  cellText("TOTAL", 2, y+totH/2+3.2, {size:9, bold:true, color:C.or});
  cellText(fmtCOP(d.total), 3, y+totH/2+3.2, {size:9, bold:true, color:C.or});
  y += totH;
  ops.push({t:"rect", x:M, y:top, w:CW, h:y-top, stroke:C.line, lw:.5});

  // note
  if(nh){
    y += 12;
    noteLines.forEach((ln, i) => {
      const by = y + 8.5 + i*12;
      if(i===0 && ln.startsWith("Nota:")){
        T("Nota:", M, by, 8.5, {bold:true, color:C.grey});
        T(ln.slice(5), M + tw("Nota:", 8.5, true), by, 8.5, {color:C.grey});
      } else T(ln, M, by, 8.5, {color:C.grey});
    });
    y += nh;
  }
  y += 14;
  closeLines.forEach((ln,i)=>T(ln, M, y+8+i*11, 8, {color:C.grey}));
  y += clh;

  // world map in the gap
  const gtop = y + 24, gbot = H - (62+50+24), gH = gbot - gtop;
  if(gH > 60){
    const [iw, ihh] = IMG_SIZE.map;
    const mw = Math.min(W*.8, gH*iw/ihh), mh = mw*ihh/iw;
    ops.unshift({t:"img", k:"map", x:(W-mw)/2, y:gtop + (gH-mh)/2, w:mw, h:mh});
  }

  // footer
  ops.push({t:"line", x1:M, y1:H-112, x2:W-M, y2:H-112, color:C.line, lw:.6});
  T("Luis Alberto Correa", M, H-94, 8.5, {bold:true});
  T("Embark Global Imports  ·  +57 315 231 8715", M, H-81, 7.5, {color:C.grey});
  const e1 = "info@embarkglobal.co", sep = "  ·  ", e2 = "www.embarkglobal.co";
  T(e1 + sep + e2, M, H-68, 7.5, {color:C.blue});
  const w1 = tw(e1, 7.5, false), ws = tw(sep, 7.5, false), w2 = tw(e2, 7.5, false);
  ops.push({t:"link", x:M, y:H-76, w:w1, h:10, url:"mailto:info@embarkglobal.co"});
  ops.push({t:"link", x:M+w1+ws, y:H-76, w:w2, h:10, url:"https://www.embarkglobal.co"});
  ops.push({t:"img", k:"iso", x:W-M-30, y:H-100, w:30, h:30});
  return ops;
}

/* ---------- renderers ---------- */
function toSVG(ops){
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Vista previa de la cotización"><rect width="${W}" height="${H}" fill="#fff"/>`;
  for(const o of ops){
    if(o.t==="text"){
      const a = o.align==="right"?"end":o.align==="center"?"middle":"start";
      s += `<text x="${o.x}" y="${o.y}" font-family="Helvetica, Arial, sans-serif" font-size="${o.size}" font-weight="${o.bold?700:400}" fill="${o.color}" text-anchor="${a}" xml:space="preserve">${esc(o.s)}</text>`;
    } else if(o.t==="rect"){
      s += `<rect x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" fill="${o.fill||"none"}" ${o.stroke?`stroke="${o.stroke}" stroke-width="${o.lw}"`:""}/>`;
    } else if(o.t==="line"){
      s += `<line x1="${o.x1}" y1="${o.y1}" x2="${o.x2}" y2="${o.y2}" stroke="${o.color}" stroke-width="${o.lw}"/>`;
    } else if(o.t==="img"){
      s += `<image href="${IMG[o.k]}" x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" preserveAspectRatio="none"/>`;
    }
  }
  return s + "</svg>";
}
function toPDF(ops, title){
  const doc = new window.jspdf.jsPDF({unit:"pt", format:"letter"});
  doc.setProperties({title, author:"Embark Global Imports"});
  for(const o of ops){
    if(o.t==="text"){
      doc.setFont("helvetica", o.bold?"bold":"normal"); doc.setFontSize(o.size); doc.setTextColor(o.color);
      doc.text(o.s, o.x, o.y, {align:o.align});
    } else if(o.t==="rect"){
      if(o.fill){ doc.setFillColor(o.fill); doc.rect(o.x,o.y,o.w,o.h,"F"); }
      if(o.stroke){ doc.setDrawColor(o.stroke); doc.setLineWidth(o.lw); doc.rect(o.x,o.y,o.w,o.h,"S"); }
    } else if(o.t==="line"){
      doc.setDrawColor(o.color); doc.setLineWidth(o.lw); doc.line(o.x1,o.y1,o.x2,o.y2);
    } else if(o.t==="img"){
      doc.addImage(IMG[o.k], "PNG", o.x, o.y, o.w, o.h, o.k, "FAST");
    } else if(o.t==="link"){
      doc.link(o.x, o.y, o.w, o.h, {url:o.url});
    }
  }
  return doc;
}

/* ---------- update ---------- */
function collect(){
  const items = rows.map(rowResolved).filter(Boolean);
  const total = items.reduce((a,b)=>a+b.total,0);
  return {
    cliente: $("#cliente").value.trim(),
    fecha: fechaLarga($("#fecha").value),
    nota: $("#nota").value.trim(),
    items, total
  };
}
let lastOps = null;
function update(){
  const d = collect();
  $("#total").textContent = fmtCOP(d.total);
  const ready = d.cliente && d.items.length;
  $("#dl").disabled = !ready;
  $("#pvinfo").textContent = ready ? "" : (!d.cliente ? "Falta el nombre del cliente" : "Agrega al menos un producto con cantidad");
  if(!J){ $("#paper").innerHTML = '<p style="padding:24px;line-height:1.4">No se pudo cargar el generador de PDF. Revisa tu conexión y recarga la página.</p>'; return; }
  const shown = {...d, cliente: d.cliente || "Nombre del cliente"};
  lastOps = layout(shown);
  $("#paper").innerHTML = toSVG(lastOps);
}

/* ---------- download ---------- */
function toast(msg, ms=2800){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("on"), ms); }
async function getDownloads(){
  try{ if(window.claude && typeof window.claude.use === "function") return await window.claude.use("downloads"); }catch(e){}
  return null;
}
function svgToPNG(svg, scale=2.5){
  return new Promise((res, rej)=>{
    const img = new Image();
    img.onload = ()=>{ const c = document.createElement("canvas"); c.width = W*scale; c.height = H*scale;
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=> b ? res({blob:b, url:c.toDataURL("image/png")}) : rej(new Error("png")), "image/png"); };
    img.onerror = rej;
    img.src = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svg)));
  });
}
function showImage(url){
  const m = $("#modal"); $("#modal-img").src = url; m.hidden = false; $("#modal-close").focus();
}
$("#modal-close").addEventListener("click", ()=>{ $("#modal").hidden = true; });

$("#dl").addEventListener("click", async ()=>{
  const d = collect(); if(!d.cliente || !d.items.length) return;
  const ops = layout(d);
  const base = `Cotizacion_${slug(d.cliente)}`;
  const doc = toPDF(ops, `Cotización ${d.cliente}`);
  const pdfBlob = doc.output("blob");
  const inClaude = !!(window.claude && typeof window.claude.use === "function");

  if(!inClaude){ doc.save(base + ".pdf"); return; }

  const dl = await getDownloads();
  if(dl){
    try{ await dl.save({filename: base + ".pdf", data: pdfBlob}); toast("PDF listo"); return; }
    catch(err){
      const c = err && err.code;
      if(c === "declined") return;
      if(c === "rate_limited"){ toast("Ya hay una descarga abierta"); return; }
    }
  }
  // Fallback 1: native share sheet with the PDF
  try{
    const f = new File([pdfBlob], base + ".pdf", {type:"application/pdf"});
    if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f], title: base}); return; }
  }catch(err){ if(err && err.name === "AbortError") return; }
  // Fallback 2: image of the quote to long-press and save/share
  try{ const png = await svgToPNG(toSVG(ops)); showImage(png.url); }
  catch(e){ toast("La descarga no está disponible en esta vista.", 4000); }
});

$("#reset").addEventListener("click", ()=>{
  $("#cliente").value = ""; $("#nota").value = ""; $("#fecha").value = todayISO();
  rows = [newRow()]; renderItems(); update(); $("#cliente").focus();
});

/* ---------- init ---------- */
$("#fecha").value = todayISO();
rows = [newRow()];
renderItems(); update();
</script>
